[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opslens"
version = "0.3.3"
description = "Turn plain-English ops requirements into reviewable, deterministic Flowpipe pipelines: catalogs of Steampipe tables and Flowpipe pipelines, a read-only SQL guard, and (optionally) an AI planner."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["flowpipe", "steampipe", "devops", "automation", "sre", "finops", "aws", "gitlab", "jira", "opsgenie"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
  "sqlglot>=25",       # the read-only SQL guard
  "httpx>=0.27",       # Flowpipe REST client (Phase 2)
]

[project.optional-dependencies]
ai = ["anthropic>=1.0,<2"]  # Phase 3 planner: Anthropic SDK. OpenAI-style providers need nothing; `pip install litellm` for the rest
web = ["fastapi>=0.110", "uvicorn>=0.29"]  # `opslens serve`
dev = ["opslens[web]", "pytest>=8", "ruff>=0.5", "opslens[ai]", "jinja2>=3.1", "markdown>=3.5", "pygments>=2.17", "pillow>=10"]  # last four: scripts/build_site.py

[project.scripts]
opslens = "opslens.cli:app"

[project.urls]
Homepage = "https://opslens.devops-monk.com"
Documentation = "https://opslens.devops-monk.com/docs/"
Source = "https://github.com/devops-monk/opslens"
Changelog = "https://github.com/devops-monk/opslens/blob/main/CHANGELOG.md"
Issues = "https://github.com/devops-monk/opslens/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "evals", "docs", "docker", "Dockerfile", "install.sh", "Makefile",
           "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/opslens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not system'"
markers = [
  "unit: pure logic, no I/O beyond tmp files",
  "integration: real components wired together (CLI, demo database, shipped catalogs), no cloud",
  "system: needs real Steampipe/Flowpipe binaries and plugins; run with OPSLENS_SYSTEM=1",
]

[tool.ruff]
line-length = 110
target-version = "py311"
