# opslens product site — opslens.devops-monk.com
# Additive server block for the SHARED VPS. Matched by server_name only, so it does
# not affect any other site on this box. No `default_server` on purpose.
# certbot --nginx appends the managed `listen 443 ssl` + cert lines and the
# HTTP->HTTPS redirect to THIS block only.

server {
    listen 80;
    listen [::]:80;
    server_name opslens.devops-monk.com;

    root /var/www/opslens;
    index index.html;

    # Static site: serve the file, fall back to 404 (no app backend).
    location / {
        try_files $uri $uri/ =404;
    }

    # The explorer's catalog data changes only with a release; revalidate often, it is small and compressed.
    location ^~ /data/ {
        gzip on; gzip_types application/json; gzip_min_length 1024;
        add_header Cache-Control "public, max-age=300";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Assets carry ?v=<version>, so a week of caching is safe.
    location ~* \.(?:png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # The one-line installer: show it in the browser as text, never cache it for long.
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
    }

    # Never serve deploy helpers even if they end up under the root.
    location ^~ /deploy/ { deny all; return 404; }

    access_log /var/log/nginx/opslens.access.log;
    error_log  /var/log/nginx/opslens.error.log;
}
