# Pack: chatops / new-s3-files
# Posts to a Teams channel for every file that landed in an S3 bucket in the last 15 minutes, with a link to the object in the
# S3 console (anyone in the channel who has AWS access can open it). It polls every 15 minutes, so it is near-real-time, not
# instant. The bucket name (acme-customer-exports) is in the SQL because Steampipe needs it as a filter: edit it for your bucket.
# A pre-signed download link needs signing code, which the Flowpipe AWS library does not provide; this template shares a
# console link instead and changes nothing in AWS.
name: new_s3_files_to_teams
title: New S3 files to Teams
description: Posts a Teams message with a console link for each file that arrived in an S3 bucket in the last 15 minutes.
variables:
  teams_team_id:
    default: CHANGE-ME
    description: Microsoft Teams team id to post into.
  teams_channel_id:
    default: CHANGE-ME
    description: Microsoft Teams channel id to post into.
trigger:
  kind: schedule
  schedule: 15m
detect:
  max_items: 20
  sql: |
    select bucket_name, key, region, content_length, last_modified
    from aws_s3_object
    where bucket_name = 'acme-customer-exports'
      and last_modified > now() - interval '15 minutes'
notify: false
actions:
  - pipeline: teams.send_channel_message
    title: Tell the channel
    args:
      team_id: "{var.teams_team_id}"
      channel_id: "{var.teams_channel_id}"
      message: "New file {key} ({content_length} bytes) in {bucket_name}: https://s3.console.aws.amazon.com/s3/object/{bucket_name}?region={region}&prefix={key}"
