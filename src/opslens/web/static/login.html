<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · opslens</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='2.6'/%3E%3Cpath d='M18.6 18.6 24 24' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/app.css">
</head>
<body class="login-body">
<main class="login-card">
  <svg class="logo" viewBox="0 0 32 32" width="44" height="44" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><circle cx="14" cy="14" r="6" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M18.6 18.6 24 24" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
  <h1>Sign in to opslens</h1>
  <p class="muted">Your team's automation workspace. Changes still wait for an approval.</p>
  <form id="f" autocomplete="on">
    <label for="user">Your name <span class="muted">(shown in the audit log)</span></label>
    <input id="user" name="user" type="text" autocomplete="username" maxlength="60" placeholder="e.g. alice">
    <label for="pw">Team password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <p class="login-err" id="err" role="alert" hidden></p>
    <button class="btn primary" id="go" type="submit">Sign in</button>
  </form>
</main>
<script src="static/login.js"></script>
</body>
</html>
