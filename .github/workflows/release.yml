# Release: push a tag vX.Y.Z that matches pyproject's version.
#   build   -> wheel + sdist, checked, installed into a clean venv and run
#   image   -> multi-arch image on ghcr.io/<owner>/opslens (X.Y.Z and latest), and on Docker Hub (abhaypratap/opslens)
#              when the repo variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (an access token) are set
#   pypi    -> PyPI via Trusted Publishing (no token stored). Runs only when the repo variable PUBLISH_PYPI is "true"
#              and a trusted publisher is configured on pypi.org for this workflow and the `pypi` environment.
#   release -> a GitHub release with the artifacts and the matching CHANGELOG section
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must match the package version
        run: |
          v="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version v$v"; exit 1; }
          grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install --quiet "$(ls dist/*.whl)[web]"
          cd /tmp && /tmp/clean/bin/opslens --version
          /tmp/clean/bin/opslens catalog stats
          /tmp/clean/bin/opslens pack list
          /tmp/clean/bin/opslens query --source demo "select count(*) as n from aws_ebs_volume"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (only when configured)
        if: env.HUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        run: |
          tags="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opslens:${GITHUB_REF_NAME} ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opslens:latest"
          if [ -n "$HUB_USER" ]; then tags="$tags ${HUB_USER}/opslens:${GITHUB_REF_NAME#v} ${HUB_USER}/opslens:latest"; fi
          { echo "tags<<EOF"; for t in $tags; do echo "$t"; done; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v {p=1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "opslens ${GITHUB_REF_NAME#v}" --notes-file notes.md
