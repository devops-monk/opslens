# Manually publish an EXISTING release tag to Docker Hub (multi-arch):  Actions > dockerhub > Run workflow > tag: v0.3.1
# Needs the repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. New tags are published by release.yml automatically.
name: dockerhub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.3.1"
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: Publish tags (X.Y.Z and latest) from the release tag's source
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/opslens:${{ steps.v.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/opslens:latest
          cache-from: type=gha,scope=release
